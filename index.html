  <body>
    <div id="root"></div>

    <script>
      const replacements = [
        { oldInitials: 'AM', newInitials: 'TJ', oldName: 'Alex Morgan', newName: 'Tasaphoom Jarattrakul' },
        { oldInitials: 'SR', newInitials: 'WS', oldName: 'Sam Rivera', newName: 'Witchyut Sangjansiri' },
        { oldInitials: 'JL', newInitials: 'AM', oldName: 'Jordan Lee', newName: 'Aniwut Mekwimanrat' },
        { oldInitials: 'TB', newInitials: 'AP', oldName: 'Taylor Brooks', newName: 'Amnart Promdee' },
        { oldInitials: 'CN', newInitials: 'AM', oldName: 'Casey Nguyen', newName: 'Auttakorn Mongkonkee' }
      ];

      function updateMembers() {
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
        let node;
        const textNodes = [];
        while ((node = walker.nextNode())) {
          textNodes.push(node);
        }

        textNodes.forEach(tNode => {
          const val = tNode.nodeValue.trim();
          replacements.forEach(item => {
            if (val === item.oldName || val === item.newName) {
              if (val === item.oldName) {
                tNode.nodeValue = item.newName;
              }
              
              const nameEl = tNode.parentElement;
              if (nameEl && nameEl.parentElement) {
                // Hide all sibling elements under the name container (role label and description)
                Array.from(nameEl.parentElement.children).forEach(sibling => {
                  if (sibling !== nameEl) {
                    sibling.style.display = 'none';
                  }
                });

                // Find the specific card container holding both the avatar circle and the text block
                const cardContainer = nameEl.parentElement.parentElement;
                if (cardContainer) {
                  cardContainer.querySelectorAll('*').forEach(el => {
                    if (el.children.length === 0 && el !== nameEl) {
                      const txt = el.textContent.trim();
                      if (txt === item.oldInitials) {
                        el.textContent = item.newInitials;
                      }
                    }
                  });
                }
              }
            }
          });
        });
      }

      const observer = new MutationObserver(() => updateMembers());
      observer.observe(document.body, { childList: true, subtree: true });
      setInterval(updateMembers, 300);
    </script>
  </body>
